# DevCollab backing services. Sandbox runner images are built separately via
# `npm run setup` (docker compose build for devcollab-runner-* is handled by
# scripts/setup-sandboxes.*).
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: devcollab
      POSTGRES_PASSWORD: devcollab
      POSTGRES_DB: devcollab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devcollab -d devcollab"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
